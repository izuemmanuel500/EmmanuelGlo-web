<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmmanuelGlo - Sign Up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;}
body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#111119;border:1px solid #222;border-radius:24px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.logo{text-align:center;margin-bottom:24px;}
.logo h1{color:#fff;font-size:28px;letter-spacing:-1px;}
.logo h1 span{color:#7c3aed;}
.logo p{color:#666;font-size:14px;margin-top:6px;}
.input-group{margin-bottom:16px;}
label{color:#aaa;font-size:12px;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
input{width:100%;background:#1a1a24;border:1px solid #2a2a3a;color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;outline:none;transition:0.2s;}
input:focus{border-color:#7c3aed;background:#1f1f2e;}
.btn{width:100%;background:#7c3aed;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer;transition:0.2s;}
.btn:hover{background:#6d28e0;transform:translateY(-1px);}
.footer{text-align:center;margin-top:20px;color:#555;font-size:13px;}
.footer a{color:#7c3aed;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Emmanuel<span>Glo</span>web</h1>
    <p>Create account with your phone</p>
  </div>
  <form id="form">
    <div class="input-group">
      <label>Username</label>
      <input type="text" placeholder="emmanuelglo" required>
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="you@email.com" required>
    </div>
    <div class="input-group">
      <label>Phone Number</label>
      <input type="tel" placeholder="+234 801 234 5678" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="••••••••" required>
    </div>
    <button class="btn" type="submit">Create Account</button>
  </form>
  <div class="footer">Built with phone 📱 by <a href="#">EmmanuelGlo</a></div>
</div>
<script>
document.getElementById('form').addEventListener('submit', (e)=>{
  e.preventDefault();
  alert('Account created! This is demo by EmmanuelGlo-web 🔥');
});
</script>
</body>
</html>
