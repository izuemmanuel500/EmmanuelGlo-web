
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Emmanuel Glow Web</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  min-height: 100vh;
  padding: 35px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 5% 15%,
    #53116d 0%, transparent 32%),
    radial-gradient(circle at 95% 85%,
    #123c72 0%, transparent 35%),
    linear-gradient(135deg,
    #050918, #0a1027, #030817);

  position: relative;
}

/* NEON CIRCUIT BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;

  background:
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 35px,
      rgba(0,220,255,.18) 36px,
      transparent 38px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent 0px,
      transparent 55px,
      rgba(255,0,220,.15) 56px,
      transparent 58px
    );

  mask-image: linear-gradient(
    to right, black, transparent 90%
  );
}

/* FLOATING NEON CUBES */

.cube {
  position: fixed;
  width: 75px;
  height: 75px;
  border: 1px solid #ed4bff;
  background: linear-gradient(
    135deg,
    rgba(255,0,220,.17),
    rgba(0,200,255,.12)
  );
  box-shadow:
    0 0 18px rgba(255,0,220,.35),
    inset 0 0 20px rgba(0,200,255,.15);
  transform: rotate(35deg) skew(-5deg);
  pointer-events: none;
  z-index: -1;
}

.cube.one {
  top: 8%;
  left: -28px;
}

.cube.two {
  top: 30%;
  left: -40px;
  width: 55px;
  height: 55px;
  border-color: #25dfff;
}

.cube.three {
  bottom: 12%;
  left: 12px;
  width: 85px;
  height: 85px;
  border-color: #a83cff;
}

.cube.four {
  top: 18%;
  right: -45px;
  width: 65px;
  height: 65px;
  border-color: #23dfff;
}

.wrapper {
  width: 100%;
  max-width: 430px;
  position: relative;
  z-index: 1;
}

/* BRAND */

.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand-name {
  font-size: clamp(24px, 7vw, 33px);
  font-weight: 900;
  letter-spacing: 2px;

  background: linear-gradient(
    90deg,
    #35dcff,
    #b54dff,
    #ff40d7
  );

  -webkit-background-clip: text;
  color: transparent;

  text-shadow: 0 0 30px rgba(130,50,255,.2);
}

.brand-line {
  margin-top: 10px;
  color: #aebbd8;
  font-size: 10px;
  letter-spacing: 4px;
}

/* SIGNUP CARD */

.card {
  width: 100%;
  padding: 27px 20px;
  border-radius: 23px;

  background: rgba(4,12,32,.83);

  border: 1px solid rgba(87,181,255,.35);

  box-shadow:
    0 0 25px rgba(0,180,255,.12),
    0 0 40px rgba(185,0,255,.13),
    inset 0 0 30px rgba(20,70,130,.1);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  animation: appear 1s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  text-align: center;
  font-size: 27px;
  margin-bottom: 9px;
}

.heading-glow {
  background: linear-gradient(
    90deg, #ffffff, #c86bff
  );
  -webkit-background-clip: text;
  color: transparent;
}

.description {
  text-align: center;
  color: #a7badb;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 25px;
}

/* INPUTS */

.input-group {
  margin-bottom: 17px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #d9e7ff;
  font-size: 12px;
  font-weight: 600;
}

.input-box {
  position: relative;
}

input, select {
  width: 100%;
  height: 49px;
  padding: 0 14px;

  background: rgba(12,24,51,.95);
  border: 1px solid rgba(92,143,205,.35);
  border-radius: 10px;

  color: white;
  font-size: 13px;
  outline: none;
  transition: .3s;
}

input::placeholder {
  color: #7183a5;
}

input:focus, select:focus {
  border-color: #30caff;

  box-shadow:
    0 0 13px rgba(0,190,255,.23);
}

.phone-row {
  display: flex;
  gap: 8px;
}

.phone-row select {
  width: 112px;
  flex-shrink: 0;
  padding: 0 8px;
  color: #67d9ff;
}

.phone-row input {
  min-width: 0;
}

/* PASSWORD EYE */

.password-box input {
  padding-right: 52px;
}

.eye-btn {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);

  background: none;
  border: none;
  color: #69cfff;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
}

.eye-btn svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* CREATE ACCOUNT BUTTON */

.create-btn {
  width: 100%;
  height: 51px;
  margin-top: 9px;

  border: none;
  border-radius: 10px;

  background: linear-gradient(
    100deg,
    #e62bd7,
    #a529f5,
    #632cff
  );

  color: white;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;

  box-shadow:
    0 0 20px rgba(203,40,255,.35);

  cursor: pointer;
  transition: .3s;
}

.create-btn:active {
  transform: scale(.97);
  box-shadow: 0 0 30px #b83cff;
}

#message {
  font-size: 12px;
  text-align: center;
  margin-top: 13px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #92a6c9;
  font-size: 12px;
  margin-top: 22px;
}

.footer a {
  color: #52d2ff;
  text-decoration: none;
  font-weight: bold;
}

.bottom-text {
  text-align: center;
  margin-top: 25px;
  font-size: 9px;
  color: #7285aa;
  letter-spacing: 2px;
}

/* SMALL PHONE SUPPORT */

@media(max-width: 360px) {
  body {
    padding: 25px 11px;
  }

  .card {
    padding: 23px 15px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="cube one"></div>
<div class="cube two"></div>
<div class="cube three"></div>
<div class="cube four"></div>

<div class="wrapper">

  <header class="brand">
    <div class="brand-name">
      EMMANUEL GLOW WEB
    </div>

    <div class="brand-line">
      BUILD • CREATE • INNOVATE
    </div>
  </header>

  <main class="card">

    <h1>
      Create an <span class="heading-glow">
      Account</span>
    </h1>

    <p class="description">
      Join Emmanuel Glow Web today
      and turn your ideas into reality.
    </p>

    <form id="signupForm">

      <div class="input-group">
        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="input-group">
        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="input-group">
        <label>Phone Number</label>

        <div class="phone-row">

          <select id="countryCode"
            aria-label="Country code">

            <option value="+234" selected>
              🇳🇬 +234
            </option>

            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+233">🇬🇭 +233</option>
            <option value="+254">🇰🇪 +254</option>
            <option value="+27">🇿🇦 +27</option>
            <option value="+91">🇮🇳 +91</option>

          </select>

          <input
            type="tel"
            id="phone"
            placeholder="Phone number"
            autocomplete="tel-national"
            required
          >

        </div>
      </div>

      <div class="input-group">
        <label>Password</label>

        <div class="input-box password-box">

          <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="eye-btn"
            data-target="password"
            aria-label="Show password"
          >
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-7 10-7
              10 7 10 7-3.5 7-10 7
              -10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>

        <div class="input-box password-box">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="eye-btn"
            data-target="confirmPassword"
            aria-label="Show confirm password"
          >
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-7 10-7
              10 7 10 7-3.5 7-10 7
              -10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

        </div>
      </div>

      <button type="submit" class="create-btn">
        CREATE ACCOUNT →
      </button>

      <p id="message"></p>

    </form>

    <p class="footer">
      Already have an account?
      <a href="#">Sign In</a>
    </p>

  </main>

  <p class="bottom-text">
    TURNING IDEAS INTO DIGITAL REALITY
  </p>

</div>

<script>

// SHOW AND HIDE PASSWORD

document.querySelectorAll(".eye-btn")
.forEach(button => {

  button.addEventListener("click", () => {

    const field = document.getElementById(
      button.dataset.target
    );

    const visible = field.type === "password";

    field.type = visible ? "text" : "password";

    button.setAttribute(
      "aria-label",
      visible ? "Hide password" : "Show password"
    );

    button.innerHTML = visible
      ? `<svg viewBox="0 0 24 24">
          <path d="M3 3l18 18"/>
          <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5
          c6.5 0 10 7 10 7a14 14 0 0 1-3 3.8"/>
          <path d="M6.2 6.2A15 15 0 0 0 2 12
          s3.5 7 10 7a10 10 0 0 0 4-.8"/>
        </svg>`
      : `<svg viewBox="0 0 24 24">
          <path d="M2 12s3.5-7 10-7
          10 7 10 7-3.5 7-10 7
          -10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>`;

  });

});

// FORM VALIDATION

document.getElementById("signupForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirm =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");

  if (password !== confirm) {

    message.style.color = "#ff6688";
    message.textContent =
      "Passwords do not match. Please try again.";

    return;
  }

  message.style.color = "#65edb0";
  message.textContent =
    "Registration demo completed successfully!";

});

</script>

</body>
  </html>
