<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#05091d">
<title>Emmanuel Glow Web - Sign Up</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030716;font-family:Arial,Helvetica,sans-serif}
/* The supplied reference artwork is the exact visual canvas. */
.stage{position:relative;width:100vw;height:100svh;overflow:hidden;background:#030716 url('background.png') center center/100% 100% no-repeat}
.hotspot{position:absolute;border:0;background:transparent;color:#fff;font:inherit;outline:none}
.field{left:24.2%;width:64.7%;height:5.45%;padding:0 2%;font-size:clamp(12px,3.7vw,20px);color:#f5f8ff;caret-color:#20dfff;background:transparent;border:0;border-radius:0}
.field::placeholder{color:transparent}
.field:focus{background:rgba(12,35,75,.18);box-shadow:inset 0 -1px rgba(36,211,255,.5)}
#username{top:46.6%}
#email{top:53.8%}
#phone{top:61.1%;left:53%;width:35.8%}
#password{top:67.7%}
#confirmPassword{top:74.3%}
.country-hit{left:11.4%;top:60.7%;width:27%;height:6.1%;opacity:.01;cursor:pointer}
.country-display{position:absolute;left:13.5%;top:61.1%;width:24%;height:5.8%;display:none;align-items:center;justify-content:center;color:#fff;font-size:clamp(12px,3.5vw,19px);background:rgba(4,14,38,.97);border:1px solid rgba(47,190,255,.5);border-radius:10px;pointer-events:none}
.eye{position:absolute;right:9.5%;width:9%;height:5%;border:0;background:transparent;cursor:pointer}
#eye1{top:67.7%}#eye2{top:74.3%}
.submit{left:11.5%;top:81.0%;width:77%;height:6.2%;border:0;border-radius:15px;background:transparent;cursor:pointer}
#feedback{position:absolute;left:12%;top:87.4%;width:76%;text-align:center;color:#7ef3c0;font-size:clamp(10px,2.8vw,14px);text-shadow:0 1px 5px #001;pointer-events:none}
@media(min-aspect-ratio: 9/16){.stage{background-size:100% 100%}}
</style>
</head>
<body>
<main class="stage" aria-label="Emmanuel Glow Web registration page">
  <form id="signupForm" autocomplete="on">
    <input class="hotspot field" id="username" name="username" type="text" placeholder="Username" autocomplete="username" aria-label="Username" required>
    <input class="hotspot field" id="email" name="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email address" required>
    <select class="hotspot country-hit" id="countryCode" aria-label="Select country calling code">
      <option value="+234" selected>Nigeria +234</option>
      <option value="+1">United States +1</option>
      <option value="+44">United Kingdom +44</option>
      <option value="+233">Ghana +233</option>
      <option value="+254">Kenya +254</option>
      <option value="+27">South Africa +27</option>
      <option value="+91">India +91</option>
    </select>
    <span class="country-display" id="countryDisplay"></span>
    <input class="hotspot field" id="phone" name="phone" type="tel" placeholder="Phone number" autocomplete="tel-national" aria-label="Phone number" required>
    <input class="hotspot field" id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" minlength="8" aria-label="Password" required>
    <button class="eye" id="eye1" type="button" aria-label="Show password"></button>
    <input class="hotspot field" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" minlength="8" aria-label="Confirm password" required>
    <button class="eye" id="eye2" type="button" aria-label="Show confirm password"></button>
    <button class="hotspot submit" type="submit" aria-label="Create account"></button>
  </form>
  <div id="feedback" role="status"></div>
</main>
<script>
const eyeSvg='<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOffSvg='<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3 3.8M6.2 6.2A15 15 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/></svg>';
function setupEye(buttonId,inputId){const b=document.getElementById(buttonId),i=document.getElementById(inputId);b.innerHTML=eyeSvg;b.addEventListener('click',()=>{const show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?eyeOffSvg:eyeSvg;b.setAttribute('aria-label',show?'Hide password':'Show password');});}
setupEye('eye1','password');setupEye('eye2','confirmPassword');
const codes={'+234':'🇳🇬 +234','+1':'🇺🇸 +1','+44':'🇬🇧 +44','+233':'🇬🇭 +233','+254':'🇰🇪 +254','+27':'🇿🇦 +27','+91':'🇮🇳 +91'};
document.getElementById('countryCode').addEventListener('change',e=>{const display=document.getElementById('countryDisplay');display.textContent=codes[e.target.value]||e.target.value;display.style.display='flex';});
document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();const p=document.getElementById('password').value;const c=document.getElementById('confirmPassword').value;const msg=document.getElementById('feedback');if(p!==c){msg.style.color='#ff8bad';msg.textContent='Passwords do not match. Please try again.';return;}msg.style.color='#7ef3c0';msg.textContent='Demo complete! This form does not save accounts yet.';});
</script>
</body>
</html>
